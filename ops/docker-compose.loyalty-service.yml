version: "3.9"

networks:
  phorest-network:
    driver: bridge

volumes:
  loyalty_mongodb_data:
  kafka_data:
  zookeeper_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: loyalty-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "42181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_data:/var/lib/zookeeper/log
    networks:
      - phorest-network

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: loyalty-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "39092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:39093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - phorest-network
  loyalty-mongodb:
    image: mongo:7.0.12
    container_name: loyalty-mongodb
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_DATABASE: loyalty_service
    volumes:
      - loyalty_mongodb_data:/data/db
    networks:
      - phorest-network

  loyalty-service:
    build:
      context: ..
      dockerfile: loyalty-service/Dockerfile
    image: phorest/loyalty-service:latest
    depends_on:
      - loyalty-mongodb
      - kafka
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://loyalty-mongodb:27017/loyalty_service
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8080"
    networks:
      - phorest-network
