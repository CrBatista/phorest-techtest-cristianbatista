spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: client-service-auth
          uri: http://client-service:8080
          predicates:
            - Path=/api/v1/auth/token
        - id: client-service-clients
          uri: http://client-service:8080
          predicates:
            - Path=/api/v1/clients/**
        - id: client-service-import
          uri: http://client-service:8080
          predicates:
            - Path=/api/v1/import/clients

        - id: booking-appointments
          uri: http://booking-service:8080
          predicates:
            - Path=/api/v1/appointments/**
        - id: booking-services
          uri: http://booking-service:8080
          predicates:
            - Path=/api/v1/services/**
        - id: booking-purchases
          uri: http://booking-service:8080
          predicates:
            - Path=/api/v1/purchases/**
        - id: booking-import-appointments
          uri: http://booking-service:8080
          predicates:
            - Path=/api/v1/import/appointments
        - id: booking-import-services
          uri: http://booking-service:8080
          predicates:
            - Path=/api/v1/import/services
        - id: booking-import-purchases
          uri: http://booking-service:8080
          predicates:
            - Path=/api/v1/import/purchases

        - id: loyalty-service
          uri: http://loyalty-service:8080
          predicates:
            - Path=/api/v1/loyalty/**

server:
  port: 8080

security:
  enabled: true
  jwt:
    secret: phorest2025-super-secret-key-change-me-please
    expiration: 3600
