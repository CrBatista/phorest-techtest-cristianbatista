spring:
  application:
    name: client-service
  data:
    mongodb:
      database: client_service
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    properties:
      spring.json.add.type.headers: false

client:
  kafka:
    topic: client-events
    enabled: true
  csv:
    expected-headers:
      - id
      - first_name
      - last_name
      - email
      - phone
      - gender
      - banned

security:
  enabled: true
  jwt:
    secret: phorest2025-super-secret-key-change-me-please
    expiration: 3600
  user:
    username: cristian
    password: phorest2025
