<section class="login-container">
  <div class="login-card app-surface">
    <img src="assets/comb-icon.svg" alt="Comb as You Are" class="logo">
    <h1>Comb as You Are</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Username</span>
        <input type="text" formControlName="username" placeholder="Username">
      </label>
      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" placeholder="Password">
      </label>
      <button class="btn-primary" type="submit" [disabled]="isSubmitting">Sign in</button>
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </form>
    <p class="footer">
      Made by <span class="highlight">Cristian</span> for <span class="highlight">Phorest</span>
    </p>
  </div>
</section>
